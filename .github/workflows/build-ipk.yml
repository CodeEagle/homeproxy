name: Build ipk for HomeProxy

permissions:
  contents: write

on:
  push:
    branches:
      - 'master'
      - 'dev'
    paths:
      - 'htdocs/**'
      - 'po/**'
      - 'root/**'
      - 'Makefile'
      - '.github/**'
      - '!.github/ISSUE_TEMPLATE/**'

  pull_request:
    branches:
      - 'master'
      - 'dev'
    types:
      - opened
      - synchronize
      - reopened
    paths:
      - 'htdocs/**'
      - 'root/**'
      - 'Makefile'
      - '.github/**'
      - '!.github/ISSUE_TEMPLATE/**'

  release:
    types:
      - published

  workflow_dispatch:

  schedule:
    - cron: '23 3 * * *'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source tree
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Generate patch against upstream
        run: |
          git remote add upstream https://github.com/immortalwrt/homeproxy.git 2>/dev/null || true
          git fetch upstream master

          BASE_COMMIT="$(git merge-base HEAD upstream/master)"
          git format-patch --stdout "${BASE_COMMIT}..HEAD" > /tmp/homeproxy-ce.patch

          if [ ! -s /tmp/homeproxy-ce.patch ]; then
            echo "Patch generation failed or produced an empty patch."
            exit 1
          fi

      - name: Checkout latest upstream source tree
        uses: actions/checkout@v6
        with:
          repository: 'immortalwrt/homeproxy'
          ref: 'master'
          path: 'build-source'

      - name: Checkout po2lmo
        uses: actions/checkout@v6
        with:
          repository: 'openwrt/luci'
          path: 'po2lmo'
          sparse-checkout: 'modules/luci-base/src'

      - name: Apply HomeProxy CE patch to latest upstream
        run: |
          pushd build-source
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git am -3 /tmp/homeproxy-ce.patch
          echo "PATCHED_COMMIT=$(git rev-parse --short HEAD)" >> $GITHUB_ENV
          popd

      - name: Setup dependencies
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo -E rm -rf /var/lib/man-db/auto-update
          sudo -E apt-get update -qq
          sudo -E apt-get install -y build-essential curl fakeroot

          pushd po2lmo/modules/luci-base/src
          make po2lmo
          sudo -E install -m0755 -s po2lmo /usr/local/bin/po2lmo
          popd

          curl -fLO "https://raw.githubusercontent.com/openwrt/openwrt/master/scripts/ipkg-build"
          sudo install -m0755 ipkg-build /usr/local/bin/ipkg-build

      - name: Build ipk file
        run: |
          pushd build-source/.github
          fakeroot bash build-ipk.sh ipk "${{ github.event_name }}"
          echo "IPK_ASSET_NAME=$(ls *.ipk)" >> $GITHUB_ENV
          echo "RELEASE_TAG=homeproxy-ce-$(basename "$(ls *.ipk)" .ipk)" >> $GITHUB_ENV
          echo "RELEASE_NAME=HomeProxy CE $(basename "$(ls *.ipk)" .ipk)" >> $GITHUB_ENV
          popd

      - name: Publishing IPK files to GitHub Artifacts
        uses: actions/upload-artifact@v7
        if: github.event_name != 'release'
        with:
          name: ${{ env.IPK_ASSET_NAME }}
          path: build-source/.github/${{ env.IPK_ASSET_NAME }}
          archive: false

      - name: Publishing to GitHub Releases
        uses: svenstaro/upload-release-action@v2
        if: github.event_name == 'release'
        with:
          repo_token: ${{ github.token }}
          file: build-source/.github/${{ env.IPK_ASSET_NAME }}
          tag: ${{ github.ref }}

      - name: Publish commit release
        uses: softprops/action-gh-release@v2
        if: github.event_name != 'release'
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: ${{ env.RELEASE_NAME }}
          body: |
            Automated build of HomeProxy CE.

            Source branch: ${{ github.ref_name }}
            Patch head: ${{ github.sha }}
            Upstream patched commit: ${{ env.PATCHED_COMMIT }}
          prerelease: false
          make_latest: false
          generate_release_notes: false
          files: build-source/.github/${{ env.IPK_ASSET_NAME }}
          fail_on_unmatched_files: true
